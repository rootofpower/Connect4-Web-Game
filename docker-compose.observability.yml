services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.153.0
    command: ["-retentionPeriod=7d"]
    ports: ["8428:8428"]
    volumes: [vm_data:/victoria-metrics-data]
    networks: [gamestudio_network]

  vmagent:
    image: victoriametrics/vmagent:v1.153.0
    command:
      - -promscrape.config=/etc/vmagent/scrape.yml
      - -remoteWrite.url=http://victoriametrics:8428/api/v1/write
    volumes: [./observability/vmagent:/etc/vmagent:ro]
    ports: ["8429:8429"]
    depends_on: [victoriametrics]
    networks: [gamestudio_network]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    networks: [gamestudio_network]

  grafana:
    image: grafana/grafana:13.2.3
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [gamestudio_network]

volumes:
  vm_data:
  grafana_data:
