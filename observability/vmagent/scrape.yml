global:
  scrape_interval: 15s
scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["backend:8080"] }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: victoriametrics
    static_configs: [{ targets: ["victoriametrics:8428"] }]